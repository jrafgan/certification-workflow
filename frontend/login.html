<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Центр управления</title>
  <link rel="stylesheet" href="/app/css/control-center.css" />
</head>
<body class="login-body">
  <form id="login-form" class="login-card" autocomplete="on">
    <div class="login-brand">Центр управления</div>
    <div class="login-sub">Вход для сотрудников</div>
    <label>Логин
      <input id="username" name="username" autocomplete="username" autofocus required />
    </label>
    <label>Пароль
      <input id="password" name="password" type="password" autocomplete="current-password" required />
    </label>
    <div id="login-error" class="login-error"></div>
    <button type="submit" id="login-btn">Войти</button>
    <div class="login-hint">Доступ только для сотрудников. Анонимный вход запрещён.</div>
  </form>
  <script src="/app/js/login.js"></script>
</body>
</html>
