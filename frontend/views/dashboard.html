  <!--
    dashboard.html — Main attention view
    Answers: "What requires my attention today?"

    Sections (in priority order):
      OVERDUE        — deadlines passed, no action recorded
      DUE TODAY      — deadlines hitting today
      ACTION NEEDED  — required step not yet taken
      DEBT           — READY_FOR_DELIVERY orders with balance_due > 0
      STALE          — NEW or WAITING_PAYMENT orders with no movement > 3 days
      OPEN TASKS     — open and unsnoozed tasks across all orders

    Data source: GET /api/dashboard/attention
  -->

  <script src="../js/api.js"></script>
