# Production stack for AdminVPS (or any Docker host — provider-independent).
#
#   nginx (80/443, SSL)  ──►  backend (API + Control Center + WhatsApp Cloud webhook)  ──►  mongo
#   certbot (renewals)
#
# WhatsApp runs via the Meta Cloud API webhook inside `backend` (POST /webhooks/whatsapp) —
# no separate agent container. One source of truth for Mongo creds (.env) → the connection
# string is built here. Only nginx publishes ports; everything else talks over the private
# `internal` network.
#
# Bring up:  docker compose up -d --build
name: certification-workflow

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks: [internal]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # No published port — Mongo is reachable only inside the Docker network.

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: certification-workflow-backend:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Built from the single source of truth above (authSource=admin for the root user).
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB:-certification-workflow}?authSource=admin
      # When the temporary whatsapp-web.js bridge runs (profile "waweb"), route panel sends
      # through it. Unset/empty → backend uses the official Meta Cloud API instead.
      WHATSAPP_WEB_SEND_URL: ${WHATSAPP_WEB_SEND_URL:-}
    depends_on:
      mongo: { condition: service_healthy }
    volumes:
      - uploads:/app/backend/uploads
      - ./keys:/app/backend/keys:ro          # Google service-account key (place on server)
    networks: [internal]
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # wa-web — TEMPORARY unofficial WhatsApp Web bridge (whatsapp-web.js, ban risk). Opt-in via
  # `--profile waweb`. Prints a QR to its logs on first boot — scan once with 507391773.
  # Receives → ingest → panel inbox; exposes internal /send for the backend's panel reply route.
  wa-web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.whatsapp
    image: certification-workflow-waweb:latest
    restart: unless-stopped
    profiles: ["waweb"]
    env_file: [.env]
    environment:
      NODE_ENV: production
      WA_WEB_PORT: "3100"
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB:-certification-workflow}?authSource=admin
      WHATSAPP_SESSION_PATH: /data/wwebjs_auth
      WHATSAPP_MEDIA_DIR: /data/whatsapp_media
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    depends_on:
      mongo: { condition: service_healthy }
    volumes:
      - wa_auth:/data/wwebjs_auth             # persisted QR login — survives restarts
      - wa_media:/data/whatsapp_media
    networks: [internal]
    expose: ["3100"]

  # gowa — UNOFFICIAL WhatsApp gateway (go-whatsapp-web-multidevice / whatsmeow, socket-based,
  # no Chromium). Ban risk. Opt-in via `--profile gowa`. Receives → webhook → our backend
  # ingest; backend sends via its REST (through the anti-ban gate). QR via its UI (bound to
  # localhost — fetch/scan over an SSH tunnel). All outbound stays operator-gated.
  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice:latest
    restart: unless-stopped
    profiles: ["gowa"]
    command:
      - rest
      - --port=3000
      - --base-path=/gowa
      - --basic-auth=${GOWA_BASIC_AUTH}
      - --webhook=http://backend:3000/webhooks/gowa
      - --webhook-secret=${GOWA_WEBHOOK_SECRET}
      - --auto-reject-call=true
      - --account-validation=false
    volumes:
      - gowa_storage:/app/storages
    networks: [internal]
    ports:
      - "127.0.0.1:3001:3000"     # UI/QR — localhost only (reach via SSH tunnel; not public)

  # tg-userbot — Telegram USERBOT (mtcute MTProto) on the operator's own account (@jrafgan).
  # Opt-in via `--profile tguserbot`. Receives → backend webhook; backend sends via its /send.
  # Interactive login (code/2FA) is driven over its HTTP API (bound to localhost). Session
  # persists in a volume. Unofficial channel — outbound stays operator-gated upstream.
  tg-userbot:
    build:
      context: .
      dockerfile: deploy/Dockerfile.tg-userbot
    image: certification-workflow-tg-userbot:latest
    restart: unless-stopped
    profiles: ["tguserbot"]
    env_file: [.env]
    environment:
      NODE_ENV: production
      TG_PORT: "3200"
      TG_API_ID: ${TG_API_ID}
      TG_API_HASH: ${TG_API_HASH}
      TG_PHONE: ${TG_PHONE}
      TG_WEBHOOK_URL: http://backend:3000/webhooks/tg-userbot
      TG_WEBHOOK_SECRET: ${TG_WEBHOOK_SECRET}
      TG_SESSION: /data/session/jrafgan
    volumes:
      - tg_session:/data
    networks: [internal]
    expose: ["3200"]
    ports:
      - "127.0.0.1:3201:3200"     # login/status API — localhost only (driven over SSH)

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [backend]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
    networks: [internal]

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Re-check for renewal every 12h; nginx picks up renewed certs on its next reload.
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

networks:
  internal:
    driver: bridge

volumes:
  mongo_data:
  mongo_config:
  uploads:
  certbot_certs:
  certbot_www:
  wa_auth:      # whatsapp-web.js session (QR login persistence)
  wa_media:     # whatsapp-web.js received attachments
  gowa_storage: # GOWA session (QR login persistence)
  tg_session:   # Telegram userbot (mtcute) session persistence
